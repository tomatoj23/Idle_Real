name: CI

# #78-A 裁决：采纳最小 CI，跑与 .githooks/pre-push 完全相同的两件事（check + test）。
# 定位是**回归网**，不是验收：本项目最硬的一关「真实浏览器首跑」CI 覆盖不到（AGENTS.md 工程红线），
# 绿勾不等于可发版。价值面在钩子拦不住的三处——--no-verify 绕过、未跑过 setup 的新克隆、
# 多会话并行下 main 的跨机会话漂移。
#
# 刻意不含 `npm audit`：ADR-018 已裁「audit 非绿不阻断验收」，装成红灯只会训练人忽略它。
# 巡检走根 scripts + docs/research。（#67 升 Electron 44 后 audit 已归零：曾判「range=* 无修复版
# 永久残留」的 extract-zip 两条，随 electron 换用自带 @electron-internal/extract-zip 一并退场，
# 勘误见 ADR-018——但「audit 不阻断」的裁决继续有效，勿因当期归零就把它串进门禁。）

on:
  push:
    branches: [main]
  pull_request:
  # 无 push 也能复跑门禁：排障、验证 runner 环境、或钩子被 --no-verify 绕过后补一次第二环境证据。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR 上取消过期跑省分钟；push:main 不取消——避免连续快推之间 main 尖端没有任何一次完整跑完。
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  gate:
    name: gate（check + test + lint 观察）
    # windows-latest：真机红线在 Windows 上，runner 与开发机同 OS 比 ubuntu 矩阵有意义（#78 票面）。
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # 跳过约 100MB 的 Electron 二进制：CI 没有任何步骤启动 Electron。全仓唯一的 `from 'electron'`
      # 在 app-desktop/electron/main.ts，它的类型来自 npm 包自带的 electron.d.ts（package.json
      # types 字段，与二进制无关）；tests/ 里唯一沾 electron 的引的是 ../electron/*（只用 node 内置），
      # 全仓 packages 内 child_process 零引用。
      # 生效机制（#67 升 Electron 44 后口径，勿按旧知识写）：44.x 的 electron 包**已无 postinstall**，
      # 二进制改在**首跑 electron 命令时**经 @electron/get 下载；CI 不启动 electron，本就不会触发下载。
      # 所以这条 env 是第二道保险（拦任何隐式 require('electron') / 首跑下载），不是拦 postinstall 的那一道。
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      # 入库的 package-lock.json 有 437 条 resolved 钉在国内镜像（开发机装出来的）。npm 的
      # replace-registry-host 默认只把 npmjs 主机改写成本机 registry，反向不成立，不改写就会
      # 让 runner 去国内 CDN 拉全部依赖。只改 CI 工作副本、不改仓库文件，本地镜像加速不受影响。
      # 详见脚本头注（含「顺带把对镜像的信任收回为对官方源的逐条校验」一节）。
      - name: Normalize dependency hosts
        run: node .github/scripts/canonicalize-lockfile.mjs

      - uses: actions/setup-node@v7.0.0
        with:
          # 与开发机同线（本机 v24.13.0）。engines 下限 22.12 的第二矩阵候选记在 #78 票评，
          # 现阶段不加——两分钟成本 × 每次 push 换不到本仓看得见的收益。
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check（四包）
        run: npm run check --workspaces --if-present

      - name: Test（四包）
        run: npm test --workspaces --if-present

      # #78-B 裁决：lint 采纳但先挂观察期。CI 比本地 pre-push 更严会让人对着红勾摸不着头脑，
      # 等噪声面确认稳定后再串进钩子与 check（那时删掉 continue-on-error 即可）。
      - name: Lint（oxlint correctness，观察中）
        continue-on-error: true
        run: npm run lint
