# #10：Windows 双击安装包（NSIS oneClick：双击即装即玩）。
# #12：追加 portable 免安装单文件（绿色版/盘点用），与 NSIS 同一产物面。
# 产物输出 release/（已 gitignore）；steamworks.js 原生模块必须 asar 解包才能加载 .node。
# renderer 产物 dist/ 与主进程产物 dist-electron/ 均为构建期产物；
# @wendao/* 已由 vite 内联进 renderer bundle，且为主进程无关依赖（devDependencies 不打包）。
appId: com.wendao.changsheng
productName: 问道长生
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
asarUnpack:
  - '**/node_modules/steamworks.js/**'
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
# #65：出货二进制 fuses 加固。只列要改的三项，未列出的 fuse 保持二进制默认（builder 对 undefined 项跳过不写）。
# runAsNode=关：堵 ELECTRON_RUN_AS_NODE 把应用当裸 Node 跑；仅作用于打包产物，dev 的 node_modules electron 不受影响。
# enableNodeCliInspectArguments=关：堵 --inspect 远程调试口。
# enableEmbeddedAsarIntegrityValidation=开：启动时校验 app.asar 头哈希；exe 侧 INTEGRITY/ELECTRONASAR 资源由 builder 注入（26.x 默认行为）。
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
