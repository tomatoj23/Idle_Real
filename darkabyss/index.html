<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暗渊 DARK ABYSS</title>
<style>
:root{
  --gold:#c9a55c; --gold-hi:#f0d79a; --blood:#a32222; --blood-dk:#5e1111;
  --mana:#2e5f9e; --panel-a:#1c150c; --panel-b:#0e0a06; --border:#6b5233;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
  font-family:Georgia,'Microsoft YaHei',serif;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
#cv{display:block;position:absolute;inset:0;cursor:crosshair}
svg.ic{width:24px;height:24px;fill:currentColor;pointer-events:none}

/* ============ HUD ============ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#topbar{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:34px;
  color:var(--gold);font-size:15px;letter-spacing:2px;text-shadow:0 2px 4px #000}
#topbar b{color:var(--gold-hi);font-weight:normal}
#topbar .t-ico{display:inline-block;width:14px;height:14px;vertical-align:-2px}
#bossbar{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:440px;text-align:center}
#bossname{color:#ff8a6a;font-size:14px;letter-spacing:4px;text-shadow:0 0 8px #000,0 2px 3px #000;margin-bottom:3px}
.bbwrap{height:14px;background:#150808;border:1px solid #7a2a1a;border-radius:7px;overflow:hidden;box-shadow:0 0 14px #000a}
#bossfill{height:100%;width:100%;background:linear-gradient(#d8452f,#7a1408);transition:width .15s}
#msglog{position:absolute;left:18px;top:56px;width:340px;font-size:13px;line-height:1.55;pointer-events:none}
#msglog div{color:#d8c9a0;text-shadow:0 1px 3px #000;animation:msgfade 6s forwards}
@keyframes msgfade{0%{opacity:0;transform:translateX(-8px)}6%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}

#bottombar{position:absolute;bottom:-8px;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:22px}
.orb{position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;
  border:3px solid #3a2c17;box-shadow:0 0 0 2px #120c05,0 4px 18px #000,inset 0 0 26px #000;
  background:radial-gradient(circle at 50% 30%,#241a10,#0a0705 72%)}
.orbfill{position:absolute;left:0;right:0;bottom:0;transition:height .18s;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-2px) skewX(-1.5deg)}50%{transform:translateX(2px) skewX(1.5deg)}}
#hpfill{background:linear-gradient(#e0472e,#7c1206 68%,#4c0a04);box-shadow:0 -2px 8px #ff7a4a inset}
#mpfill{background:linear-gradient(#3f7fd6,#1c3f7e 68%,#101f46);box-shadow:0 -2px 8px #6fa8ff inset}
.orbshine{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse at 50% -18%,rgba(255,255,255,.28),transparent 46%),
             radial-gradient(circle at 50% 118%,rgba(0,0,0,.55),transparent 55%)}
.orb span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-size:13px;color:#f5ead2;text-shadow:0 1px 3px #000,0 0 6px #000;z-index:2}
#centerui{display:flex;flex-direction:column;align-items:center;gap:7px;padding-bottom:16px}
#xpbar{width:300px;height:7px;background:#0a0805;border:1px solid #45351c;border-radius:4px;overflow:hidden}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,#8a6a2c,#e8c96a);box-shadow:0 0 6px #e8c96a88}
#skillrow{display:flex;align-items:center;gap:8px}
.slot{position:relative;width:46px;height:46px;border:2px solid #55411f;border-radius:8px;
  background:linear-gradient(#20180d,#0d0905);display:flex;align-items:center;justify-content:center;
  color:#c8b284;pointer-events:auto;cursor:pointer;box-shadow:0 3px 8px #000,inset 0 0 10px #0009}
.slot:hover{border-color:var(--gold)}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-size:12px;color:#fff;text-shadow:0 1px 2px #000;font-style:normal}
.slot .key{position:absolute;left:4px;top:1px;font-size:10px;color:#8a7448;font-style:normal}
.slot .cdmask{position:absolute;inset:0;border-radius:6px;pointer-events:none}
.slot.sep{width:10px;border:none;background:none;box-shadow:none;cursor:default}

#hint{position:absolute;bottom:138px;left:0;right:0;text-align:center;color:var(--gold-hi);
  font-size:16px;letter-spacing:2px;text-shadow:0 0 10px #000,0 2px 4px #000;animation:hintpulse 1.4s ease-in-out infinite}
@keyframes hintpulse{0%,100%{opacity:.75}50%{opacity:1}}
#tips{position:absolute;bottom:172px;left:0;right:0;text-align:center;color:#a08c60;font-size:13px;
  letter-spacing:1px;text-shadow:0 1px 3px #000;transition:opacity 1.5s}

/* ============ 面板 ============ */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;
  background:linear-gradient(var(--panel-a),var(--panel-b));
  border:2px solid var(--border);border-radius:6px;box-shadow:0 10px 50px #000,inset 0 0 40px #00000088;
  padding:16px 20px;pointer-events:auto;color:#cbbd97}
.panel h2{margin:0 0 12px;color:var(--gold);font-size:17px;font-weight:normal;letter-spacing:5px;
  text-align:center;border-bottom:1px solid #45361c;padding-bottom:8px}
.panel .close{position:absolute;right:10px;top:8px;color:#8a7448;cursor:pointer;font-size:18px;padding:2px 6px}
.panel .close:hover{color:#fff}
#panelInv{width:640px}
.inv-flex{display:flex;gap:18px}
#eqSlots{display:grid;grid-template-columns:repeat(2,54px);gap:8px;align-content:start}
.eslot{width:54px;height:54px;border:2px solid #4a3a1e;border-radius:6px;background:#0d0905;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:#5a4a2a}
.eslot.filled{color:inherit}
.eslot small{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:#7a6844}
#eqSlots .eslot{margin-bottom:14px}
#invGrid{display:grid;grid-template-columns:repeat(8,54px);gap:6px;align-content:start}
.islot{width:54px;height:54px;border:1px solid #3a2d16;border-radius:5px;background:#0d0905;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.islot:hover{border-color:var(--gold);background:#171006}
.panel-note{margin-top:12px;font-size:12px;color:#8a7448;text-align:center;letter-spacing:1px}
#panelChar{width:400px}
.statrow{display:flex;align-items:center;justify-content:space-between;padding:5px 2px;font-size:15px}
.statrow .sn{color:#d8c9a0;letter-spacing:2px}
.statrow .sv{color:var(--gold-hi)}
.plusbtn{width:22px;height:22px;border:1px solid var(--border);border-radius:4px;background:#241a0d;
  color:var(--gold);cursor:pointer;font-size:14px;line-height:1;margin-left:10px}
.plusbtn:hover{background:#3a2c15;color:#fff}
.plusbtn:disabled{opacity:.3;cursor:default}
.derived{margin-top:12px;border-top:1px solid #45361c;padding-top:10px;font-size:13px;line-height:1.9;color:#a89668}
.derived b{color:#d8c9a0;font-weight:normal;float:right}
#panelShop{width:480px}
#shopGold{text-align:center;color:var(--gold-hi);margin-bottom:10px;font-size:14px}
#shopGrid{display:flex;gap:12px;justify-content:center}
.shopitem{width:120px;border:1px solid #4a3a1e;border-radius:6px;background:#0d0905;padding:10px 8px;
  text-align:center;cursor:pointer}
.shopitem:hover{border-color:var(--gold);background:#171006}
.shopitem .sic{height:44px;display:flex;align-items:center;justify-content:center}
.shopitem .snm{font-size:12px;min-height:30px;line-height:1.3}
.shopitem .spr{color:var(--gold-hi);font-size:13px;margin-top:5px}

/* ============ Tooltip ============ */
#tooltip{position:fixed;z-index:60;max-width:270px;pointer-events:none;
  background:linear-gradient(#16100a,#0a0704);border:1px solid var(--border);border-radius:5px;
  padding:10px 12px;font-size:13px;line-height:1.55;box-shadow:0 6px 24px #000}
#tooltip .tname{font-size:14px;letter-spacing:1px;margin-bottom:2px}
#tooltip .ttype{color:#8a7448;font-size:11px;margin-bottom:6px}
#tooltip .taff{color:#9fc0ff}
#tooltip .tval{color:var(--gold-hi);margin-top:6px;font-size:12px}
#tooltip .thelp{color:#6a5a3a;font-size:11px;margin-top:3px}
#tooltip .tcmp{color:#7fae7f;font-size:12px}

/* ============ 标题/死亡 ============ */
#titleScreen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#000}
#titleScreen .bgimg{position:absolute;inset:0;background:url('assets/title.png') center/cover no-repeat;
  filter:saturate(.92) brightness(.85)}
#titleScreen .shade{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 60%,transparent 20%,rgba(0,0,0,.82) 78%),
  linear-gradient(#000c,transparent 30%,transparent 62%,#000e)}
#titleScreen h1{position:relative;margin:0;color:var(--gold-hi);font-size:76px;font-weight:normal;
  letter-spacing:18px;text-shadow:0 0 34px #ff6a1a55,0 4px 10px #000,0 0 4px #000;
  font-family:Georgia,'Times New Roman',serif}
#titleScreen .sub{position:relative;color:#a88c58;font-size:22px;letter-spacing:16px;margin:10px 0 52px;
  text-shadow:0 2px 6px #000}
.mbtn{position:relative;pointer-events:auto;min-width:230px;margin:7px 0;padding:12px 34px;font-size:17px;
  letter-spacing:6px;color:var(--gold);background:linear-gradient(#241a0ecc,#120c06cc);
  border:1px solid var(--border);border-radius:4px;cursor:pointer;font-family:inherit;
  transition:all .15s;text-shadow:0 1px 2px #000}
.mbtn:hover{color:var(--gold-hi);border-color:var(--gold-hi);box-shadow:0 0 18px #c9a55c33,0 0 8px #000;
  background:linear-gradient(#33250fee,#1a1208ee)}
.mbtn:disabled{opacity:.35;cursor:default}
#titleScreen .vtip{position:absolute;bottom:26px;color:#6a5a3a;font-size:12px;letter-spacing:2px}
#deathScreen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(ellipse at center,#3a0808dd,#000000f2 75%)}
#deathScreen h1{color:#c83232;font-size:58px;font-weight:normal;letter-spacing:14px;margin:0 0 8px;
  text-shadow:0 0 30px #f004,0 3px 8px #000}
#deathScreen p{color:#8a6a5a;letter-spacing:3px;margin:0 0 40px}
</style>
</head>
<body>
<!-- SVG 图标库（手绘剪影） -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ic-sword" viewBox="0 0 24 24"><path d="M21 2.6 11.2 12.4l1.5 1.5L21 5.6V2.6zM10 13.6l-4.6 4.6-.9 2.7-.6.6-1.4-1.4.6-.6 2.7-.9L10.4 14l-1.2-1.2 1.2-1.2 2 2-1.2 1.2L10 13.6z"/></symbol>
    <symbol id="ic-helm" viewBox="0 0 24 24"><path d="M12 2C7 2 4 6.2 4 11v8l3.4-2.2V13H9.6v6.4L12 21l2.4-1.6V13h2.2v3.8L20 19v-8c0-4.8-3-9-8-9zm-3 8.5h6v1.8H9v-1.8z"/></symbol>
    <symbol id="ic-armor" viewBox="0 0 24 24"><path d="M12 2l4.2 2v3.4l3 1.8-2 12.8H6.8l-2-12.8 3-1.8V4L12 2zm0 4.6-2.6 1.8 2.6 6 2.6-6L12 6.6z"/></symbol>
    <symbol id="ic-ring" viewBox="0 0 24 24"><path d="M12 6.2a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm0 2.6a4.4 4.4 0 1 1 0 8.8 4.4 4.4 0 0 1 0-8.8zM12 .8l3 3.2L12 7.4 9 4l3-3.2z"/></symbol>
    <symbol id="ic-flask-hp" viewBox="0 0 24 24"><path d="M9.4 2h5.2v2.2l-1.2 1v3.4l4.3 8.2A3.4 3.4 0 0 1 14.7 22H9.3a3.4 3.4 0 0 1-3-5.2l4.3-8.2V5.2l-1.2-1V2zm2.6 9.4-2 3.8h4l-2-3.8z"/></symbol>
    <symbol id="ic-flask-mp" viewBox="0 0 24 24"><path d="M9.4 2h5.2v2.2l-1.2 1v3.4l4.3 8.2A3.4 3.4 0 0 1 14.7 22H9.3a3.4 3.4 0 0 1-3-5.2l4.3-8.2V5.2l-1.2-1V2zm2.6 9.4-2 3.8h4l-2-3.8z"/></symbol>
    <symbol id="ic-fire" viewBox="0 0 24 24"><path d="M12 1.6c1.2 4.4 5.6 5.8 5.6 11a5.6 5.6 0 0 1-11.2 0c0-2.2 1.1-3.7 2.2-5.6.2 2 1 3.2 2.2 3.6-1.2-3.4-.2-6.6 1.2-9zm0 17.2a3.2 3.2 0 0 0 3.2-3.2c0-1.7-1.3-2.6-2-4-.9 1.5-2 2-2.9 3.4a3.2 3.2 0 0 0 1.7 3.8z"/></symbol>
    <symbol id="ic-nova" viewBox="0 0 24 24"><path d="M11 2h2v7.2l5-5 1.4 1.5-5.1 5.1H22v2h-7.7l5.1 5.1-1.4 1.4-5-4.9V22h-2v-7.6l-5 4.9-1.4-1.4 5.1-5.1H2v-2h7.7L4.6 5.7 6 4.3l5 4.9V2z"/></symbol>
    <symbol id="ic-heal" viewBox="0 0 24 24"><path d="M9.8 3h4.4v6.8H21v4.4h-6.8V21H9.8v-6.8H3V9.8h6.8V3z"/></symbol>
    <symbol id="ic-coin" viewBox="0 0 24 24"><path d="M12 2.4A9.6 9.6 0 1 0 12 21.6 9.6 9.6 0 0 0 12 2.4zm0 2.6a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></symbol>
    <symbol id="ic-gate" viewBox="0 0 24 24"><path d="M12 1.6l8.6 10.4L12 22.4 3.4 12 12 1.6zm0 4.2L6.8 12l5.2 6.2 5.2-6.2L12 5.8z"/></symbol>
  </defs>
</svg>

<canvas id="cv"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="topbar">
    <span>暗渊 · 第 <b id="uiFloor">1</b> 层</span>
    <span><svg class="ic t-ico" style="color:#e8c96a"><use href="#ic-coin"/></svg> <b id="uiGold">0</b></span>
    <span>等级 <b id="uiLevel">1</b></span>
  </div>
  <div id="bossbar" class="hidden">
    <div id="bossname"></div>
    <div class="bbwrap"><div id="bossfill"></div></div>
  </div>
  <div id="msglog"></div>
  <div id="hint" class="hidden"></div>
  <div id="tips">左键 移动 / 攻击 &nbsp;·&nbsp; 右键 火球术 &nbsp;·&nbsp; 1~3 技能 &nbsp;·&nbsp; Q/E 药水 &nbsp;·&nbsp; I 背包 &nbsp;·&nbsp; C 角色 &nbsp;·&nbsp; F 交互</div>
  <div id="bottombar">
    <div class="orb" id="orbHp"><div class="orbfill" id="hpfill"></div><div class="orbshine"></div><span id="hptext"></span></div>
    <div id="centerui">
      <div id="xpbar"><div id="xpfill"></div></div>
      <div id="skillrow">
        <div class="slot" id="slotQ" title="生命药水"><svg class="ic" style="color:#e0472e"><use href="#ic-flask-hp"/></svg><i class="key">Q</i><i class="cnt" id="cntHp">0</i></div>
        <div class="slot" id="slotE" title="法力药水"><svg class="ic" style="color:#4f8fe0"><use href="#ic-flask-mp"/></svg><i class="key">E</i><i class="cnt" id="cntMp">0</i></div>
        <div class="slot sep"></div>
        <div class="slot" id="slot1" title="火球术"><svg class="ic" style="color:#ff9a3c"><use href="#ic-fire"/></svg><i class="key">1</i><div class="cdmask" id="cd1"></div></div>
        <div class="slot" id="slot2" title="冰霜新星"><svg class="ic" style="color:#7fd8ff"><use href="#ic-nova"/></svg><i class="key">2</i><div class="cdmask" id="cd2"></div></div>
        <div class="slot" id="slot3" title="圣光术"><svg class="ic" style="color:#ffe08a"><use href="#ic-heal"/></svg><i class="key">3</i><div class="cdmask" id="cd3"></div></div>
      </div>
    </div>
    <div class="orb" id="orbMp"><div class="orbfill" id="mpfill"></div><div class="orbshine"></div><span id="mptext"></span></div>
  </div>
</div>

<!-- 背包 -->
<div id="panelInv" class="panel hidden">
  <span class="close" data-close="panelInv">✕</span>
  <h2>行 囊</h2>
  <div class="inv-flex">
    <div>
      <div id="eqSlots"></div>
    </div>
    <div><div id="invGrid"></div></div>
  </div>
  <div class="panel-note">左键 装备 · 右键 出售 · 鼠标悬停查看详情</div>
</div>

<!-- 角色 -->
<div id="panelChar" class="panel hidden">
  <span class="close" data-close="panelChar">✕</span>
  <h2>英 魂</h2>
  <div id="charStats"></div>
</div>

<!-- 祭坛商店 -->
<div id="panelShop" class="panel hidden">
  <span class="close" data-close="panelShop">✕</span>
  <h2>血 汁 祭 坛</h2>
  <div id="shopGold"></div>
  <div id="shopGrid"></div>
  <div class="panel-note">以血为契，以金为引 · 点击购买</div>
</div>

<div id="tooltip" class="hidden"></div>

<!-- 标题 -->
<div id="titleScreen">
  <div class="bgimg"></div><div class="shade"></div>
  <h1>DARK ABYSS</h1>
  <div class="sub">暗 渊 地 城</div>
  <button class="mbtn" id="btnNew">新 的 征 程</button>
  <button class="mbtn" id="btnContinue" disabled>继 续 征 程</button>
  <div class="vtip">单机原型 · 无需联网 · 进度自动保存</div>
</div>

<!-- 死亡 -->
<div id="deathScreen" class="hidden">
  <h1>你 已 陨 落</h1>
  <p id="deathInfo">黑暗吞噬了你的灵魂……</p>
  <button class="mbtn" id="btnRevive">重 返 暗 渊</button>
</div>

<script src="js/audio.js"></script>
<script src="js/items.js"></script>
<script src="js/game.js"></script>
</body>
</html>
